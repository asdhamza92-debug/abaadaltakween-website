backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'ar'

collections:
  - name: "pages"
    label: "الصفحات"
    files:
      - name: "home"
        label: "الصفحة الرئيسية"
        file: "index.html"
        fields:
          - {label: "عنوان الصفحة", name: "title", widget: "string"}
          - {label: "وصف الشركة", name: "description", widget: "text"}
          - {label: "العنوان الرئيسي", name: "hero_title", widget: "string"}
          - {label: "نص الهيرو", name: "hero_text", widget: "text"}
          - {label: "رقم الهاتف 1", name: "phone1", widget: "string"}
          - {label: "رقم الهاتف 2", name: "phone2", widget: "string"}
          - {label: "البريد الإلكتروني", name: "email", widget: "string"}
          - {label: "العنوان", name: "address", widget: "string"}
          - {label: "انستقرام", name: "instagram", widget: "string"}
          - {label: "عدد المشاريع", name: "projects_count", widget: "number"}
          - {label: "سنوات الخبرة", name: "years_count", widget: "number"}
          - {label: "عدد الخدمات", name: "services_count", widget: "number"}
          - {label: "نسبة الرضا", name: "satisfaction", widget: "number"}
